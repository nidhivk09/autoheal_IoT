name: Deploy Infrastructure

# Deploys the Bicep templates under cloud/infra/ whenever they change on
# main. Requires these repo secrets (Settings -> Secrets and variables ->
# Actions) - never commit their values:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (OIDC federated
#     credential for a service principal scoped to rg-selfhealing-iot)
#   AZURE_RESOURCE_GROUP
#   POSTGRES_ADMIN_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "cloud/infra/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az deployment group validate \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file cloud/infra/main.bicep \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file cloud/infra/main.bicep \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}"
