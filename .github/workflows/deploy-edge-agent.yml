name: Deploy Edge Agent

# "DevOps for IoT": on a push touching edge_agent/, SSHes into the physical
# Raspberry Pi, pulls the latest code, reinstalls dependencies if they
# changed, and restarts the systemd service. Requires these repo secrets:
#   PI_SSH_HOST, PI_SSH_USER
#   PI_SSH_PRIVATE_KEY   (private key matching an authorized_keys entry on
#                          the Pi - generate a deploy-only keypair, do not
#                          reuse a personal key)
# The Pi must already have this repo cloned at /opt/autoheal-iot (see
# docs/research_notes.md for the one-time setup) with its own .env in
# edge_agent/ - that file is never touched by this workflow.

on:
  push:
    branches: [main]
    paths:
      - "edge_agent/**"
  workflow_dispatch: {}

jobs:
  deploy-edge-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/autoheal-iot
            git fetch origin main
            git reset --hard origin/main
            cd edge_agent
            ./.venv/bin/pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart edge-agent.service
            sudo systemctl status edge-agent.service --no-pager
