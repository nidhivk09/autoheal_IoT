; ESP32 edge firmware for the self-healing IoT project.
;
; Two build variants of the same code:
;   esp32dev      - the normal firmware
;   esp32dev_bad  - identical, plus a deliberate telemetry regression
;                   (AUTOHEAL_BAD_FIRMWARE). Used by the bad_firmware fault to
;                   exercise OTA self-test + rollback. Never flash it by hand.
;
; The firmware version is injected at build time; CI sets it via
;   PLATFORMIO_BUILD_FLAGS='-DFW_VERSION=\"1.0.<run>\"'
; and falls back to "0.0.0-dev" (see include/config.h) for local builds.
;
; No credentials are compiled in - WiFi/IoT Hub identity live in NVS and are
; provisioned over serial (scripts/provision.py), so one binary serves the
; whole fleet and can be uploaded to blob storage safely.

[platformio]
default_envs = esp32dev

[env]
; espressif32 6.x = Arduino-ESP32 2.0.x / ESP-IDF 4.4
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; two ~1.9MB OTA app slots + 128KB filesystem for the offline telemetry buffer
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1

[env:esp32dev]
build_flags =
    -DAUTOHEAL_ENABLE_FAULT_INJECTION=1

[env:esp32dev_bad]
build_flags =
    ${env:esp32dev.build_flags}
    -DAUTOHEAL_BAD_FIRMWARE=1
